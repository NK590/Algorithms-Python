name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # front matter, 선행 개념, 파일 구성, 상대 경로 링크, 자동 생성 목차가 최신인지 확인
      - name: Validate structure, links and generated index
        run: python tools/gen_index.py --check

      - name: Syntax check
        run: python -m compileall -q tools lv*/

      - name: Run tests
        run: python -m pytest -q
